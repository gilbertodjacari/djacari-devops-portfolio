name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check repository files
      run: |
        echo "Files in repo:"
        ls -la
        if [ -f index.html ]; then echo "index.html found"; else echo "index.html missing" >&2; exit 1; fi
